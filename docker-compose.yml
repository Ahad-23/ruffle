version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: contract-registry-db
    environment:
      POSTGRES_DB: contract_registry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contract_registry"]
      interval: 5s
      timeout: 5s
      retries: 5

  contract-registry:
    build:
      context: .
      dockerfile: contract-registry/Dockerfile
    container_name: contract-registry-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/contract_registry
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
